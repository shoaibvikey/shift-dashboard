<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HB | L1 Roster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        try {
            const savedTheme = localStorage.getItem('shift-dashboard-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.classList.toggle('dark', savedTheme ? savedTheme === 'dark' : prefersDark);
        } catch (_) {
            // Keep the dashboard usable when browser storage is unavailable.
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }

        html { color-scheme: light; }
        html.dark { color-scheme: dark; }
        html.dark body { background-color: #0b1220; color: #e2e8f0; }
        html.dark input { color-scheme: dark; }

        html.dark [class~="bg-white"] { background-color: #172033; }
        html.dark [class~="bg-white/90"] { background-color: rgb(30 41 59 / 0.9); }
        html.dark [class~="bg-white/50"] { background-color: rgb(30 41 59 / 0.5); }
        html.dark [class~="bg-slate-50"] { background-color: #111827; }
        html.dark [class~="bg-slate-50/50"] { background-color: rgb(17 24 39 / 0.6); }
        html.dark [class~="bg-blue-50/30"] { background-color: rgb(30 58 138 / 0.24); }
        html.dark [class~="bg-slate-100"] { background-color: #1e293b; }
        html.dark [class~="bg-slate-200"] { background-color: #334155; }
        html.dark [class~="hover:bg-slate-50"]:hover { background-color: #1e293b; }
        html.dark [class~="hover:bg-slate-50/50"]:hover { background-color: #1e293b; }

        html.dark [class~="text-slate-900"] { color: #f8fafc; }
        html.dark [class~="text-slate-800"],
        html.dark [class~="text-slate-700"] { color: #e2e8f0; }
        html.dark [class~="text-slate-600"] { color: #cbd5e1; }
        html.dark [class~="text-slate-500"],
        html.dark [class~="text-slate-400"] { color: #94a3b8; }
        html.dark [class*="border-slate-"] { border-color: #334155; }

        html.dark [class~="bg-amber-50"] { background-color: #3f2a12; }
        html.dark [class~="border-amber-200"] { border-color: #92400e; }
        html.dark [class~="text-amber-700"] { color: #fcd34d; }
        html.dark [class~="bg-blue-50"] { background-color: #172554; }
        html.dark [class~="border-blue-200"] { border-color: #1d4ed8; }
        html.dark [class~="text-blue-700"] { color: #93c5fd; }
        html.dark [class~="bg-indigo-50"] { background-color: #1e1b4b; }
        html.dark [class~="border-indigo-200"] { border-color: #4338ca; }
        html.dark [class~="text-indigo-700"] { color: #a5b4fc; }
        html.dark [class~="bg-emerald-50"] { background-color: #052e2b; }
        html.dark [class~="border-emerald-200"] { border-color: #047857; }
        html.dark [class~="text-emerald-700"] { color: #6ee7b7; }
        html.dark [class~="bg-rose-50"] { background-color: #4c1d2a; }
        html.dark [class~="border-rose-200"] { border-color: #be123c; }
        html.dark [class~="text-rose-700"] { color: #fda4af; }
        html.dark [class~="bg-purple-50"] { background-color: #3b0764; }
        html.dark [class~="border-purple-200"] { border-color: #7e22ce; }
        html.dark [class~="text-purple-700"] { color: #d8b4fe; }
        html.dark [class~="bg-cyan-50"] { background-color: #083344; }
        html.dark [class~="border-cyan-200"] { border-color: #0e7490; }
        html.dark [class~="text-cyan-700"] { color: #67e8f9; }
        html.dark [class~="bg-orange-50"] { background-color: #431407; }
        html.dark [class~="border-orange-200"] { border-color: #c2410c; }
        html.dark [class~="text-orange-700"] { color: #fdba74; }
        html.dark [class~="bg-pink-50"] { background-color: #500724; }
        html.dark [class~="text-pink-700"] { color: #f9a8d4; }
        html.dark [class~="bg-green-100"] { background-color: #064e3b; }
        html.dark [class~="text-green-700"] { color: #6ee7b7; }
        html.dark [class~="bg-purple-100"] { background-color: #581c87; }
        html.dark [class~="text-purple-700"] { color: #e9d5ff; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center text-slate-800">

    <div class="max-w-6xl w-full">
        
        <!-- Header Section -->
        <header class="mb-8 text-center md:text-left flex flex-col md:flex-row md:items-end md:justify-between gap-4 border-b border-slate-200 pb-6">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">ShiftTracker</h1>
            </div>
            
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:flex-wrap justify-end">
                
                <!-- Team Member Selector -->
                <div class="relative flex items-center w-full sm:w-auto">
                    <label for="user-select" class="sr-only">Select Team Member</label>
                    <select id="user-select" class="bg-white border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full sm:w-56 p-2 pr-8 shadow-sm transition-all duration-200 cursor-pointer hover:border-slate-400 font-semibold appearance-none">
                        <option>Loading team...</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>

                <!-- View Toggles -->
                <div class="bg-slate-200 p-1 rounded-lg inline-flex self-center sm:self-auto shrink-0">
                    <button id="btn-daily" onclick="setView('daily')" class="px-4 py-1.5 rounded-md text-sm font-semibold shadow bg-white text-slate-800 transition-all">Daily</button>
                    <button id="btn-monthly" onclick="setView('monthly')" class="px-4 py-1.5 rounded-md text-sm font-medium text-slate-500 hover:text-slate-700 transition-all">Monthly</button>
                </div>
                
                <!-- Date Picker (Daily View) -->
                <div class="relative flex items-center w-full sm:w-auto" id="date-picker-container">
                    <label for="date-picker" class="sr-only">Select Date</label>
                    <input type="date" id="date-picker" 
                        class="bg-white border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 shadow-sm transition-all duration-200 cursor-pointer hover:border-slate-400 font-medium">
                </div>

                <!-- Month Picker (Monthly View) -->
                <div class="relative flex items-center w-full sm:w-auto" id="month-picker-container" style="display: none;">
                    <label for="month-picker" class="sr-only">Select Month</label>
                    <input type="month" id="month-picker" 
                        class="bg-white border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 shadow-sm transition-all duration-200 cursor-pointer hover:border-slate-400 font-medium">
                </div>

                <button id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode"
                    class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-slate-300 bg-white p-2 text-sm font-semibold text-slate-700 shadow-sm transition-colors hover:bg-slate-50">
                    <span id="theme-toggle-icon" aria-hidden="true">🌙</span>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="content" class="space-y-6 min-h-[300px] pb-12">
            <!-- Loading Placeholder -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center animate-pulse">
                <div class="h-4 bg-slate-200 rounded w-3/4 mx-auto mb-4"></div>
                <div class="h-4 bg-slate-200 rounded w-1/2 mx-auto"></div>
            </div>
        </main>

    </div>

    <script>
        let selectedUser = "Shoaib Akhtar"; 
        
        let monthlyDataCache = {}; 
        let currentLoadedData = {}; 
        let currentView = 'daily';
        let currentDate = ''; 

        const shiftStyles = {
            "6 AM - 3 PM IST": { bg: "bg-amber-50", border: "border-amber-200", text: "text-amber-700", icon: "🌅" },
            "2 PM - 11 PM IST": { bg: "bg-blue-50", border: "border-blue-200", text: "text-blue-700", icon: "🌤️" },
            "10 PM - 7 AM IST": { bg: "bg-indigo-50", border: "border-indigo-200", text: "text-indigo-700", icon: "🌙" },
            "WO": { bg: "bg-emerald-50", border: "border-emerald-200", text: "text-emerald-700", icon: "🌴" },
            "Leave": { bg: "bg-rose-50", border: "border-rose-200", text: "text-rose-700", icon: "🤒" },
            "Holiday": { bg: "bg-purple-50", border: "border-purple-200", text: "text-purple-700", icon: "🎉" },
            "FH": { bg: "bg-cyan-50", border: "border-cyan-200", text: "text-cyan-700", icon: "🏖️" },
            "F H": { bg: "bg-cyan-50", border: "border-cyan-200", text: "text-cyan-700", icon: "🏖️" },
            "CO": { bg: "bg-orange-50", border: "border-orange-200", text: "text-orange-700", icon: "⏱️" }
        };
        
        const shiftOrder = [
            "6 AM - 3 PM IST",
            "2 PM - 11 PM IST",
            "10 PM - 7 AM IST"
        ];
        const nonWorkingShiftOrder = ["WO", "Leave", "CO", "FH", "F H", "Holiday"];

        const defaultStyle = { bg: "bg-slate-50", border: "border-slate-200", text: "text-slate-700", icon: "📋" };
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        // Parses out the WFO/WFH tag if present
        function formatName(name) {
            return String(name).split('|')[0]
                .replace(/\u00a0/g, ' ')
                .replace(/\s*\(Self Commute\)/gi, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function getRosterTags(name) {
            return String(name).split('|').slice(1).map(tag => tag.trim()).filter(Boolean);
        }

        // Reads work location and office city from optional pipe-separated roster tags.
        function getLocation(name) {
            const match = getRosterTags(name).join(' ').match(/\b(WFO|WFH)\b/i);
            return match ? match[1].toUpperCase() : null;
        }

        function getOfficeCity(name) {
            const match = getRosterTags(name).join(' ').match(/\b(Pune|Noida)\b/i);
            return match ? match[1][0].toUpperCase() + match[1].slice(1).toLowerCase() : null;
        }

        function isNonWorkingShift(shift) {
            return nonWorkingShiftOrder.some(status => status.toLowerCase() === shift.trim().toLowerCase());
        }

        function getShiftSortValue(shift) {
            const normalizedShift = shift.trim();
            const timeMatch = normalizedShift.match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)\b/i);
            if (timeMatch) {
                let hour = Number(timeMatch[1]) % 12;
                if (timeMatch[3].toUpperCase() === 'PM') hour += 12;
                return hour * 60 + Number(timeMatch[2] || 0);
            }

            const configuredIndex = shiftOrder.indexOf(normalizedShift);
            if (configuredIndex >= 0) return configuredIndex * 60;

            const statusIndex = nonWorkingShiftOrder.findIndex(status => status.toLowerCase() === normalizedShift.toLowerCase());
            if (statusIndex >= 0) return 10000 + statusIndex;
            if (/^WFH$/i.test(normalizedShift)) return 9000;
            if (/^WFO$/i.test(normalizedShift)) return 9001;
            return 8000;
        }

        function updateThemeToggle() {
            const isDark = document.documentElement.classList.contains('dark');
            const button = document.getElementById('theme-toggle');
            if (!button) return;

            const targetTheme = isDark ? 'light' : 'dark';
            const label = `Switch to ${targetTheme} mode`;
            button.setAttribute('aria-label', label);
            button.setAttribute('aria-pressed', String(isDark));
            button.title = label;
            document.getElementById('theme-toggle-icon').textContent = isDark ? '☀️' : '🌙';
        }

        function setTheme(theme) {
            const isDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', isDark);
            try {
                localStorage.setItem('shift-dashboard-theme', isDark ? 'dark' : 'light');
            } catch (_) {
                // The selected theme still applies for this page load.
            }
            updateThemeToggle();
        }

        function getStatusBadge(statusObj) {
            if (statusObj.location === 'WFO') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-green-100 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-green-700 ring-1 ring-inset ring-green-600/20">WFO</span>';
            if (statusObj.location === 'WFH') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-purple-100 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-purple-700 ring-1 ring-inset ring-purple-700/10">WFH</span>';
            
            const s = statusObj.shift;
            if (s === 'WO') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-emerald-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-emerald-700 ring-1 ring-inset ring-emerald-600/20">WO</span>';
            if (s === 'Leave') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-rose-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-rose-700 ring-1 ring-inset ring-rose-600/20">Leave</span>';
            if (s === 'CO') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-orange-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-orange-700 ring-1 ring-inset ring-orange-600/20">CO</span>';
            if (s === 'FH' || s === 'F H') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-cyan-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-cyan-700 ring-1 ring-inset ring-cyan-600/20">FH</span>';
            if (s === 'Holiday') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-pink-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-pink-700 ring-1 ring-inset ring-pink-600/20">Holiday</span>';
            if (s === 'Not Scheduled') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-slate-100 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-500 ring-1 ring-inset ring-slate-500/20">N/A</span>';
            
            return `<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-blue-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-blue-700 ring-1 ring-inset ring-blue-700/10 truncate max-w-[80px]" title="${s}">${s}</span>`;
        }

        function populateUserDropdown(data) {
            const usersSet = new Set();
            for (const date in data) {
                const dayData = data[date];
                for (const shift in dayData) {
                    if (isNaN(shift)) {
                        dayData[shift].forEach(name => usersSet.add(formatName(name)));
                    }
                }
            }
            
            const usersArray = Array.from(usersSet).sort((a, b) => a.localeCompare(b));
            const select = document.getElementById('user-select');
            select.innerHTML = '';
            
            let found = false;
            usersArray.forEach(user => {
                const option = document.createElement('option');
                option.value = user;
                option.textContent = user;
                
                if (user === selectedUser) {
                    option.selected = true;
                    found = true;
                }
                select.appendChild(option);
            });
            
            if (!found && usersArray.length > 0) {
                const defaultMatch = usersArray.find(u => u === "Shoaib Akhtar");
                if (defaultMatch) {
                    selectedUser = defaultMatch;
                    select.value = defaultMatch;
                } else {
                    selectedUser = usersArray[0];
                    select.value = usersArray[0];
                }
            }
        }

        async function init() {
            currentDate = new Date().toLocaleDateString('en-CA');
            const datePicker = document.getElementById('date-picker');
            const monthPicker = document.getElementById('month-picker');

            document.getElementById('theme-toggle').addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark');
                setTheme(isDark ? 'light' : 'dark');
            });
            updateThemeToggle();
            
            datePicker.value = currentDate;
            monthPicker.value = currentDate.substring(0, 7); 
            
            await loadDataForDate(currentDate);

            datePicker.addEventListener('change', async (e) => {
                const newDate = e.target.value;
                monthPicker.value = newDate.substring(0, 7);
                await handleDateChange(newDate);
            });

            monthPicker.addEventListener('change', async (e) => {
                const newMonth = e.target.value;
                const newDate = `${newMonth}-01`;
                datePicker.value = newDate;
                await handleDateChange(newDate);
            });

            document.getElementById('user-select').addEventListener('change', (e) => {
                selectedUser = e.target.value;
                updateViews();
            });
        }

        async function handleDateChange(newDate) {
            const prevMonthYear = currentDate.substring(0, 7); 
            const newMonthYear = newDate.substring(0, 7);
            currentDate = newDate;
            
            if (prevMonthYear !== newMonthYear) {
                await loadDataForDate(currentDate);
            } else {
                updateViews();
            }
        }

        async function loadDataForDate(dateStr) {
            const dateObj = new Date(dateStr + 'T00:00:00');
            const year = dateObj.getFullYear();
            const monthName = monthNames[dateObj.getMonth()];
            const filePath = `${year}/${monthName}.json`;
            const cacheKey = `${year}-${monthName}`;

            if (monthlyDataCache[cacheKey]) {
                currentLoadedData = monthlyDataCache[cacheKey];
                populateUserDropdown(currentLoadedData);
                updateViews();
                return;
            }

            try {
                document.getElementById('content').innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center animate-pulse">
                        <div class="h-4 bg-slate-200 rounded w-3/4 mx-auto mb-4"></div>
                        <div class="h-4 bg-slate-200 rounded w-1/2 mx-auto"></div>
                    </div>`;

                const response = await fetch(filePath, { cache: 'no-cache' });
                if (!response.ok) throw new Error("File not found");
                
                const data = await response.json();
                monthlyDataCache[cacheKey] = data;
                currentLoadedData = data;
                
                populateUserDropdown(currentLoadedData);
                updateViews();

            } catch (error) {
                currentLoadedData = {}; 
                document.getElementById('user-select').innerHTML = '<option>No data available</option>';
                document.getElementById('content').innerHTML = `
                    <div class="bg-slate-50 border border-slate-200 text-slate-600 px-4 py-10 rounded-2xl text-center max-w-3xl mx-auto shadow-sm">
                        <svg class="w-10 h-10 mx-auto text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l6 6v10a2 2 0 01-2 2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 14h6"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11v6"></path></svg>
                        <p class="font-semibold text-lg text-slate-800">No Roster Data Found</p>
                        <p class="text-sm mt-1">Make sure you have uploaded the file to: <br><strong class="bg-white px-2 py-0.5 rounded border border-slate-200 text-blue-600 mt-2 inline-block">${filePath}</strong></p>
                    </div>`;
            }
        }

        function updateViews() {
            if (currentView === 'daily') renderDailyView();
            else renderMonthlyView();
        }

        function setView(view) {
            currentView = view;
            const btnDaily = document.getElementById('btn-daily');
            const btnMonthly = document.getElementById('btn-monthly');
            const datePickerContainer = document.getElementById('date-picker-container');
            const monthPickerContainer = document.getElementById('month-picker-container');

            if (view === 'daily') {
                btnDaily.className = "px-4 py-1.5 rounded-md text-sm font-semibold shadow bg-white text-slate-800 transition-all";
                btnMonthly.className = "px-4 py-1.5 rounded-md text-sm font-medium text-slate-500 hover:text-slate-700 transition-all";
                datePickerContainer.style.display = "flex";
                monthPickerContainer.style.display = "none";
                renderDailyView();
            } else {
                btnMonthly.className = "px-4 py-1.5 rounded-md text-sm font-semibold shadow bg-white text-slate-800 transition-all";
                btnDaily.className = "px-4 py-1.5 rounded-md text-sm font-medium text-slate-500 hover:text-slate-700 transition-all";
                datePickerContainer.style.display = "none";
                monthPickerContainer.style.display = "flex";
                renderMonthlyView();
            }
        }

        function renderDailyView() {
            if (Object.keys(currentLoadedData).length === 0) return; 

            const dayData = currentLoadedData[currentDate];
            const contentDiv = document.getElementById('content');
            
            if (!dayData) {
                contentDiv.innerHTML = `
                    <div class="bg-white border border-slate-200 text-slate-500 px-4 py-8 rounded-2xl shadow-sm text-center max-w-3xl mx-auto">
                        <p>No shift assignments found for this exact date.</p>
                    </div>`;
                return;
            }

            const shiftEntries = Object.entries(dayData)
                .filter(([shift, members]) => Number.isNaN(Number(shift)) && Array.isArray(members) && members.length > 0)
                .map(([shift, rawMembers]) => ({
                    shift,
                    members: rawMembers.map(raw => ({
                        raw,
                        name: formatName(raw),
                        location: getLocation(raw),
                        city: getOfficeCity(raw)
                    }))
                }));

            const myEntry = shiftEntries.find(entry => entry.members.some(member => member.name === selectedUser));
            shiftEntries.sort((a, b) => {
                if (a.shift === myEntry?.shift) return -1;
                if (b.shift === myEntry?.shift) return 1;
                return getShiftSortValue(a.shift) - getShiftSortValue(b.shift) || a.shift.localeCompare(b.shift);
            });

            const allMembers = shiftEntries.flatMap(entry => entry.members);
            const cityTaggedCount = allMembers.filter(member => member.city).length;
            const missingCityCount = allMembers.length - cityTaggedCount;
            const cityNote = cityTaggedCount === 0
                ? 'Pune/Noida counts are unavailable because this roster has no city tags.'
                : missingCityCount > 0
                    ? `City tags are present for ${cityTaggedCount} of ${allMembers.length} assignments; untagged members are not included in Pune/Noida counts.`
                    : '';

            let html = `
                <div class="max-w-6xl mx-auto space-y-4">
                    ${!myEntry ? `<div class="rounded-xl border border-slate-200 bg-white p-4 text-sm text-slate-600">${selectedUser} has no shift assignment for this date.</div>` : ''}
                    ${cityNote ? `<p class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-600">${cityNote} Add a city after each member's WFO/WFH tag, for example <code class="rounded bg-slate-100 px-1.5 py-0.5">Name | WFO | Pune</code> or <code class="rounded bg-slate-100 px-1.5 py-0.5">Name | WFH | Noida</code>.</p>` : ''}
                    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
            `;

            shiftEntries.forEach(entry => {
                const { shift, members } = entry;
                const isMyShift = shift === myEntry?.shift;
                const isStatusGroup = isNonWorkingShift(shift);
                const style = shiftStyles[shift] || defaultStyle;
                const sortedMembers = [...members].sort((a, b) => {
                    if (a.name === selectedUser) return -1;
                    if (b.name === selectedUser) return 1;
                    const locationRank = value => value === 'WFO' ? 0 : value === 'WFH' ? 1 : 2;
                    return locationRank(a.location) - locationRank(b.location) || a.name.localeCompare(b.name);
                });
                const hasLocationData = members.some(member => member.location) || /^(WFO|WFH)$/i.test(shift);
                const wfoCount = /^(WFO)$/i.test(shift) ? members.length : members.filter(member => member.location === 'WFO').length;
                const wfhCount = /^(WFH)$/i.test(shift) ? members.length : members.filter(member => member.location === 'WFH').length;
                const hasCityData = members.some(member => member.city);
                const puneCount = members.filter(member => member.city === 'Pune').length;
                const noidaCount = members.filter(member => member.city === 'Noida').length;
                const metric = (label, value) => `<span class="inline-flex items-center gap-1 rounded-lg bg-white/90 px-2.5 py-1 text-xs text-slate-600"><span>${label}</span><strong class="font-bold text-slate-800">${value}</strong></span>`;
                const placementClass = isMyShift ? 'md:col-span-2 xl:col-span-3 ring-2 ring-blue-500/30' : '';
                const memberGridClass = isMyShift ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-1';

                html += `
                    <article class="${style.bg} border ${style.border} ${placementClass} rounded-2xl p-5 shadow-sm">
                        <div class="flex flex-wrap items-center justify-between gap-2 border-b ${style.border} pb-3">
                            <h2 class="flex items-center gap-2 text-lg font-bold ${style.text}">
                                <span aria-hidden="true">${style.icon}</span>
                                <span>${shift}</span>
                            </h2>
                            ${isMyShift ? `<span class="rounded-full bg-blue-600 px-3 py-1 text-xs font-bold uppercase tracking-wide text-white">${isStatusGroup ? 'Your status' : 'Your shift'}</span>` : ''}
                        </div>
                        <div class="mt-4 flex flex-wrap gap-2">
                            ${metric(isStatusGroup ? 'Members' : 'On shift', members.length)}
                            ${!isStatusGroup ? `
                                ${metric('WFO', hasLocationData ? wfoCount : '—')}
                                ${metric('WFH', hasLocationData ? wfhCount : '—')}
                                ${metric('Pune', hasCityData ? puneCount : '—')}
                                ${metric('Noida', hasCityData ? noidaCount : '—')}
                                ${hasCityData && members.some(member => !member.city) ? metric('City missing', members.filter(member => !member.city).length) : ''}
                            ` : ''}
                        </div>
                        <ul class="mt-4 grid ${memberGridClass} gap-2">
                            ${sortedMembers.map(member => {
                                const location = member.location || (/^WFO$/i.test(shift) ? 'WFO' : /^WFH$/i.test(shift) ? 'WFH' : null);
                                const badge = getStatusBadge({ shift, location });
                                const dotClass = location === 'WFO' ? 'bg-green-500' : location === 'WFH' ? 'bg-purple-500' : 'bg-slate-300';
                                const cityBadge = member.city ? `<span class="rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide text-slate-600">${member.city}</span>` : '';

                                return `
                                    <li class="flex min-w-0 items-center gap-2 rounded-lg border ${style.border} bg-white/90 px-3 py-2.5 text-sm font-medium text-slate-800 shadow-sm">
                                        <span class="h-2 w-2 shrink-0 rounded-full ${dotClass}" aria-hidden="true"></span>
                                        <span class="min-w-0 flex-1 truncate">${member.name}</span>
                                        ${cityBadge}${badge}
                                    </li>
                                `;
                            }).join('')}
                        </ul>
                    </article>
                `;
            });

            html += `
                    </div>
                </div>
            `;
            contentDiv.innerHTML = html;
        }

        function renderMonthlyView() {
            if (Object.keys(currentLoadedData).length === 0) return;

            const contentDiv = document.getElementById('content');
            const sortedDates = Object.keys(currentLoadedData).sort();
            
            let html = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                        <h2 class="font-bold text-slate-800 text-lg">${selectedUser}'s Monthly Schedule</h2>
                    </div>
                    
                    <div class="hidden lg:grid grid-cols-7 gap-px bg-slate-200">
                        ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => `
                            <div class="bg-slate-50 p-3 text-center text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                ${day}
                            </div>
                        `).join('')}
            `;

            if (sortedDates.length > 0) {
                const firstDate = new Date(sortedDates[0] + 'T00:00:00');
                const firstDayOfWeek = firstDate.getDay(); 
                for (let i = 0; i < firstDayOfWeek; i++) {
                    html += `<div class="bg-slate-50 min-h-[100px] p-2"></div>`;
                }
            }

            for (const d of sortedDates) {
                const dayData = currentLoadedData[d];
                let myShift = "Not Found / Leave";
                let myLocation = null;
                const validShifts = Object.keys(dayData).filter(k => isNaN(k));

                for (const shift of validShifts) {
                    const assignedMatch = dayData[shift].find(n => formatName(n) === selectedUser);
                    if (assignedMatch) {
                        myShift = shift;
                        myLocation = getLocation(assignedMatch);
                        break;
                    }
                }

                const style = shiftStyles[myShift] || defaultStyle;
                const dateObj = new Date(d + 'T00:00:00');
                const dayNum = dateObj.getDate();
                const isToday = d === currentDate;
                const todayStyles = isToday ? 'ring-2 ring-blue-500 ring-inset bg-blue-50/30' : 'bg-white';
                
                const locationBadgeStyle = myLocation === 'WFO' 
                    ? 'bg-green-100 text-green-700 ring-1 ring-green-600/20' 
                    : 'bg-purple-100 text-purple-700 ring-1 ring-purple-600/20';

                html += `
                    <div class="${todayStyles} min-h-[100px] p-3 flex flex-col hover:bg-slate-50 transition-colors">
                        <span class="text-sm font-semibold text-slate-700 mb-2 ${isToday ? 'text-blue-600' : ''}">${dayNum}</span>
                        <div class="mt-auto flex flex-col gap-1.5">
                            <div class="inline-flex items-center gap-1.5 px-2 py-1 rounded-md text-xs font-semibold ${style.bg} ${style.text} border ${style.border} shadow-sm max-w-full overflow-hidden whitespace-nowrap text-ellipsis" title="${myShift}">
                                ${style.icon} <span class="truncate">${myShift}</span>
                            </div>
                            ${myLocation ? `<div class="inline-flex items-center justify-center px-1.5 py-0.5 rounded text-[10px] font-bold tracking-wider ${locationBadgeStyle}">${myLocation}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            if (sortedDates.length > 0) {
                const lastDate = new Date(sortedDates[sortedDates.length - 1] + 'T00:00:00');
                const lastDayOfWeek = lastDate.getDay();
                for (let i = lastDayOfWeek; i < 6; i++) {
                    html += `<div class="bg-slate-50 min-h-[100px] p-2"></div>`;
                }
            }

            html += `</div>`; 

            // Mobile List View
            html += `<div class="lg:hidden divide-y divide-slate-100">`;

            for (const d of sortedDates) {
                const dayData = currentLoadedData[d];
                let myShift = "Not Found / Leave";
                let myLocation = null;
                const validShifts = Object.keys(dayData).filter(k => isNaN(k));

                for (const shift of validShifts) {
                    const assignedMatch = dayData[shift].find(n => formatName(n) === selectedUser);
                    if (assignedMatch) {
                        myShift = shift;
                        myLocation = getLocation(assignedMatch);
                        break;
                    }
                }

                const style = shiftStyles[myShift] || defaultStyle;
                const dateObj = new Date(d + 'T00:00:00');
                const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                const monthDay = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const isWeekend = (dateObj.getDay() === 0 || dateObj.getDay() === 6);
                const rowBg = isWeekend ? 'bg-slate-50/50' : 'bg-white';
                const isToday = d === currentDate;
                const todayStyles = isToday ? 'border-l-4 border-l-blue-500 bg-blue-50/20' : 'border-l-4 border-l-transparent';
                
                const locationBadgeStyle = myLocation === 'WFO' 
                    ? 'bg-green-100 text-green-700 ring-1 ring-green-600/20' 
                    : 'bg-purple-100 text-purple-700 ring-1 ring-purple-600/20';

                html += `
                    <div class="${rowBg} ${todayStyles} p-4 flex justify-between items-center hover:bg-slate-50 transition-colors">
                        <div>
                            <div class="font-semibold text-slate-700">${monthDay}</div>
                            <div class="text-xs text-slate-400 font-medium">${dayName}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            ${myLocation ? `<div class="inline-flex items-center justify-center px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider ${locationBadgeStyle}">${myLocation}</div>` : ''}
                            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold ${style.bg} ${style.text} border ${style.border} shadow-sm">
                                ${style.icon} ${myShift}
                            </span>
                        </div>
                    </div>
                `;
            }

            html += `
                    </div>
                </div>
            `;

            contentDiv.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
