<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Shift Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center text-slate-800">

    <div class="max-w-6xl w-full">
        
        <!-- Header Section -->
        <header class="mb-8 text-center md:text-left flex flex-col md:flex-row md:items-end md:justify-between gap-4 border-b border-slate-200 pb-6">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Shift Dashboard</h1>
                <p class="text-slate-500 text-sm mt-1">Production Support Roster</p>
            </div>
            
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:flex-wrap justify-end">
                
                <!-- Team Member Selector -->
                <div class="relative flex items-center w-full sm:w-auto">
                    <label for="user-select" class="sr-only">Select Team Member</label>
                    <select id="user-select" class="bg-white border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full sm:w-56 p-2 pr-8 shadow-sm transition-all duration-200 cursor-pointer hover:border-slate-400 font-semibold appearance-none">
                        <option>Loading team...</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>

                <!-- View Toggles -->
                <div class="bg-slate-200 p-1 rounded-lg inline-flex self-center sm:self-auto shrink-0">
                    <button id="btn-daily" onclick="setView('daily')" class="px-4 py-1.5 rounded-md text-sm font-semibold shadow bg-white text-slate-800 transition-all">Daily</button>
                    <button id="btn-monthly" onclick="setView('monthly')" class="px-4 py-1.5 rounded-md text-sm font-medium text-slate-500 hover:text-slate-700 transition-all">Monthly</button>
                </div>
                
                <!-- Date Picker -->
                <div class="relative flex items-center w-full sm:w-auto" id="date-picker-container">
                    <label for="date-picker" class="sr-only">Select Date</label>
                    <input type="date" id="date-picker" 
                        class="bg-white border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 shadow-sm transition-all duration-200 cursor-pointer hover:border-slate-400 font-medium">
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="content" class="space-y-6 min-h-[300px] pb-12">
            <!-- Loading Placeholder -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center animate-pulse">
                <div class="h-4 bg-slate-200 rounded w-3/4 mx-auto mb-4"></div>
                <div class="h-4 bg-slate-200 rounded w-1/2 mx-auto"></div>
            </div>
        </main>

    </div>

    <script>
        let selectedUser = "Shoaib Akhtar"; // Default user
        
        let monthlyDataCache = {}; 
        let currentLoadedData = {}; 
        let currentView = 'daily';
        let currentDate = ''; 

        const shiftStyles = {
            "6 AM - 3 PM IST": { bg: "bg-amber-50", border: "border-amber-200", text: "text-amber-700", icon: "🌅" },
            "2 PM - 11 PM IST": { bg: "bg-blue-50", border: "border-blue-200", text: "text-blue-700", icon: "🌤️" },
            "10 PM - 7 AM IST": { bg: "bg-indigo-50", border: "border-indigo-200", text: "text-indigo-700", icon: "🌙" },
            "WO": { bg: "bg-emerald-50", border: "border-emerald-200", text: "text-emerald-700", icon: "🌴" },
            "Leave": { bg: "bg-rose-50", border: "border-rose-200", text: "text-rose-700", icon: "🤒" },
            "Holiday": { bg: "bg-purple-50", border: "border-purple-200", text: "text-purple-700", icon: "🎉" },
            "FH": { bg: "bg-cyan-50", border: "border-cyan-200", text: "text-cyan-700", icon: "🏖️" },
            "CO": { bg: "bg-orange-50", border: "border-orange-200", text: "text-orange-700", icon: "⏱️" }
        };
        
        const shiftOrder = [
            "6 AM - 3 PM IST",
            "2 PM - 11 PM IST",
            "10 PM - 7 AM IST"
        ];

        const defaultStyle = { bg: "bg-slate-50", border: "border-slate-200", text: "text-slate-700", icon: "📋" };
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        function formatName(name) {
            return name.replace(/\s*\(Self Commute\)/gi, '').trim();
        }

        // Returns dynamic badges based on daily status
        function getStatusBadge(status, baseShift) {
            if (status === baseShift) return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-green-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-green-700 ring-1 ring-inset ring-green-600/20">Office</span>';
            if (status === 'WFH') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-purple-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-purple-700 ring-1 ring-inset ring-purple-700/10">WFH</span>';
            if (status === 'WO') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-emerald-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-emerald-700 ring-1 ring-inset ring-emerald-600/20">WO</span>';
            if (status === 'Leave') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-rose-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-rose-700 ring-1 ring-inset ring-rose-600/20">Leave</span>';
            if (status === 'CO') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-orange-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-orange-700 ring-1 ring-inset ring-orange-600/20">CO</span>';
            if (status === 'FH') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-cyan-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-cyan-700 ring-1 ring-inset ring-cyan-600/20">FH</span>';
            if (status === 'Holiday') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-pink-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-pink-700 ring-1 ring-inset ring-pink-600/20">Holiday</span>';
            if (status === 'Not Scheduled') return '<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-slate-100 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-500 ring-1 ring-inset ring-slate-500/20">N/A</span>';
            
            // If they are covering a completely different shift
            return `<span class="ml-auto inline-flex shrink-0 items-center rounded-md bg-blue-50 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-blue-700 ring-1 ring-inset ring-blue-700/10 truncate max-w-[80px]" title="${status}">${status}</span>`;
        }

        function populateUserDropdown(data) {
            const usersSet = new Set();
            for (const date in data) {
                const dayData = data[date];
                for (const shift in dayData) {
                    if (isNaN(shift)) {
                        dayData[shift].forEach(name => usersSet.add(name));
                    }
                }
            }
            
            const usersArray = Array.from(usersSet).sort((a, b) => formatName(a).localeCompare(formatName(b)));
            const select = document.getElementById('user-select');
            select.innerHTML = '';
            
            let found = false;
            usersArray.forEach(user => {
                const option = document.createElement('option');
                option.value = user;
                option.textContent = formatName(user);
                
                if (user === selectedUser || formatName(user) === selectedUser) {
                    option.selected = true;
                    selectedUser = user;
                    found = true;
                }
                select.appendChild(option);
            });
            
            if (!found && usersArray.length > 0) {
                const defaultMatch = usersArray.find(u => formatName(u) === "Shoaib Akhtar");
                if (defaultMatch) {
                    selectedUser = defaultMatch;
                    select.value = defaultMatch;
                } else {
                    selectedUser = usersArray[0];
                    select.value = usersArray[0];
                }
            }
        }

        async function init() {
            currentDate = new Date().toLocaleDateString('en-CA');
            const datePicker = document.getElementById('date-picker');
            datePicker.value = currentDate;
            
            await loadDataForDate(currentDate);

            datePicker.addEventListener('change', async (e) => {
                const newDate = e.target.value;
                const prevMonthYear = currentDate.substring(0, 7); 
                const newMonthYear = newDate.substring(0, 7);
                
                currentDate = newDate;
                
                if (prevMonthYear !== newMonthYear) {
                    await loadDataForDate(currentDate);
                } else {
                    updateViews();
                }
            });

            document.getElementById('user-select').addEventListener('change', (e) => {
                selectedUser = e.target.value;
                updateViews();
            });
        }

        async function loadDataForDate(dateStr) {
            const dateObj = new Date(dateStr + 'T00:00:00');
            const year = dateObj.getFullYear();
            const monthName = monthNames[dateObj.getMonth()];
            
            const filePath = `${year}/${monthName}.json`;
            const cacheKey = `${year}-${monthName}`;

            if (monthlyDataCache[cacheKey]) {
                currentLoadedData = monthlyDataCache[cacheKey];
                populateUserDropdown(currentLoadedData);
                updateViews();
                return;
            }

            try {
                document.getElementById('content').innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center animate-pulse">
                        <div class="h-4 bg-slate-200 rounded w-3/4 mx-auto mb-4"></div>
                        <div class="h-4 bg-slate-200 rounded w-1/2 mx-auto"></div>
                    </div>`;

                const response = await fetch(filePath); 
                if (!response.ok) throw new Error("File not found");
                
                const data = await response.json();
                monthlyDataCache[cacheKey] = data;
                currentLoadedData = data;
                
                populateUserDropdown(currentLoadedData);
                updateViews();

            } catch (error) {
                currentLoadedData = {}; 
                document.getElementById('user-select').innerHTML = '<option>No data available</option>';
                document.getElementById('content').innerHTML = `
                    <div class="bg-slate-50 border border-slate-200 text-slate-600 px-4 py-10 rounded-2xl text-center max-w-3xl mx-auto shadow-sm">
                        <svg class="w-10 h-10 mx-auto text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l6 6v10a2 2 0 01-2 2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 14h6"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11v6"></path></svg>
                        <p class="font-semibold text-lg text-slate-800">No Roster Data Found</p>
                        <p class="text-sm mt-1">Make sure you have uploaded the file to: <br><strong class="bg-white px-2 py-0.5 rounded border border-slate-200 text-blue-600 mt-2 inline-block">${filePath}</strong></p>
                    </div>`;
            }
        }

        function updateViews() {
            if (currentView === 'daily') renderDailyView();
            else renderMonthlyView();
        }

        function setView(view) {
            currentView = view;
            
            const btnDaily = document.getElementById('btn-daily');
            const btnMonthly = document.getElementById('btn-monthly');
            const datePickerContainer = document.getElementById('date-picker-container');

            if (view === 'daily') {
                btnDaily.className = "px-4 py-1.5 rounded-md text-sm font-semibold shadow bg-white text-slate-800 transition-all";
                btnMonthly.className = "px-4 py-1.5 rounded-md text-sm font-medium text-slate-500 hover:text-slate-700 transition-all";
                datePickerContainer.style.display = "flex";
                renderDailyView();
            } else {
                btnMonthly.className = "px-4 py-1.5 rounded-md text-sm font-semibold shadow bg-white text-slate-800 transition-all";
                btnDaily.className = "px-4 py-1.5 rounded-md text-sm font-medium text-slate-500 hover:text-slate-700 transition-all";
                datePickerContainer.style.display = "none";
                renderMonthlyView();
            }
        }

        function renderDailyView() {
            if (Object.keys(currentLoadedData).length === 0) return; 

            const dayData = currentLoadedData[currentDate];
            const contentDiv = document.getElementById('content');
            
            if (!dayData) {
                contentDiv.innerHTML = `
                    <div class="bg-white border border-slate-200 text-slate-500 px-4 py-8 rounded-2xl shadow-sm text-center max-w-3xl mx-auto">
                        <p>No shift assignments found for this exact date.</p>
                    </div>`;
                return;
            }

            // --- 1. Compute Base Shifts dynamically for the whole month ---
            const baseShifts = {};
            const usersSet = new Set();
            const shiftCounts = {};
            const overrideStatuses = ['WO', 'Leave', 'Holiday', 'FH', 'CO', 'WFH'];

            for (const d in currentLoadedData) {
                for (const shift in currentLoadedData[d]) {
                    if (isNaN(shift)) {
                        currentLoadedData[d][shift].forEach(rawName => {
                            const name = formatName(rawName);
                            usersSet.add(name);
                            if (!shiftCounts[name]) shiftCounts[name] = {};
                            shiftCounts[name][shift] = (shiftCounts[name][shift] || 0) + 1;
                        });
                    }
                }
            }

            for (const user of usersSet) {
                let maxCount = 0;
                let bShift = "Other";
                for (const shift in shiftCounts[user]) {
                    if (!overrideStatuses.includes(shift)) {
                        if (shiftCounts[user][shift] > maxCount) {
                            maxCount = shiftCounts[user][shift];
                            bShift = shift;
                        }
                    }
                }
                baseShifts[user] = bShift;
            }

            function getStatusToday(user) {
                for (const shift in dayData) {
                    if (isNaN(shift)) {
                        if (dayData[shift].map(formatName).includes(user)) return shift;
                    }
                }
                return "Not Scheduled";
            }

            // --- 2. Render UI ---
            let myActualStatus = getStatusToday(selectedUser);
            let myBaseShift = baseShifts[selectedUser] || "Unknown Shift";
            
            const style = shiftStyles[myActualStatus] || defaultStyle;
            let html = `<div class="max-w-3xl mx-auto">`;

            html += `
                <div class="${style.bg} border ${style.border} rounded-2xl p-6 md:p-8 shadow-sm transition-all duration-300">
                    <div class="flex items-center justify-between mb-4 border-b ${style.border} pb-4">
                        <h2 class="text-lg font-semibold ${style.text} flex items-center gap-2">
                            <span>${style.icon}</span> Status Today
                        </h2>
                    </div>
                    
                    <div class="text-3xl md:text-4xl font-extrabold ${style.text} tracking-tight">
                        ${myActualStatus}
                    </div>
                    <div class="text-sm font-medium ${style.text} opacity-80 mt-2 mb-6">
                        Base Shift: ${myBaseShift}
                    </div>
            `;

            let myShiftTeam = Array.from(usersSet).filter(u => baseShifts[u] === myBaseShift && u !== selectedUser);

            // Sort so working people show first
            myShiftTeam.sort((a, b) => {
                const statA = getStatusToday(a);
                const statB = getStatusToday(b);
                const rank = (s) => s === myBaseShift ? 0 : (s === 'WFH' ? 1 : 2);
                return rank(statA) - rank(statB);
            });

            if (myShiftTeam.length > 0) {
                html += `
                    <h3 class="text-xs font-bold uppercase tracking-wider ${style.text} opacity-80 mb-3">
                        My Base Team (${myBaseShift})
                    </h3>
                    <ul class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                `;
                
                myShiftTeam.forEach(p => {
                    const pStatus = getStatusToday(p);
                    const badge = getStatusBadge(pStatus, myBaseShift);
                    const dimClass = overrideStatuses.includes(pStatus) && pStatus !== 'WFH' ? 'opacity-70 bg-white/50' : 'bg-white/90 shadow-sm';
                    
                    html += `
                        <li class="${dimClass} border ${style.border} rounded-lg px-3 py-2 text-sm flex items-center text-slate-800 font-medium">
                            <div class="w-2 h-2 rounded-full ${pStatus === myBaseShift ? 'bg-green-500' : 'bg-slate-300'} mr-2.5 shrink-0"></div>
                            <span class="truncate pr-2">${p}</span>
                            ${badge}
                        </li>`;
                });
                html += `</ul>`;
            } else {
               html += `<p class="text-sm opacity-80 font-medium ${style.text}">You are the only one in this base shift.</p>`;
            }
            html += `</div>`;

            // 3. Render rest of the team grouped by Base Shift
            const otherShifts = Array.from(new Set(Object.values(baseShifts)))
                .filter(s => s !== myBaseShift && s !== "Other");
            
            otherShifts.sort((a,b) => shiftOrder.indexOf(a) - shiftOrder.indexOf(b));

            html += `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mt-6">
                    <details class="group">
                        <summary class="flex justify-between items-center font-medium cursor-pointer list-none p-6 text-slate-800 hover:bg-slate-50 transition-colors">
                            <span class="flex items-center gap-2 font-semibold">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                </svg>
                                View Rest of the Team
                            </span>
                            <span class="transition group-open:rotate-180 text-slate-400">
                                <svg fill="none" height="24" shape-rendering="geometricPrecision" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
                            </span>
                        </summary>
                        
                        <div class="px-6 pb-6 pt-2 border-t border-slate-100 bg-slate-50/50 space-y-6">
            `;

            for (const shift of otherShifts) {
                const sStyle = shiftStyles[shift] || defaultStyle;
                const teamMembers = Array.from(usersSet).filter(u => baseShifts[u] === shift);
                
                teamMembers.sort((a, b) => {
                    const statA = getStatusToday(a);
                    const statB = getStatusToday(b);
                    const rank = (s) => s === shift ? 0 : (s === 'WFH' ? 1 : 2);
                    return rank(statA) - rank(statB);
                });
                
                html += `
                    <div>
                        <h3 class="text-xs font-bold uppercase tracking-wide text-slate-500 mb-3 flex items-center gap-2 border-b border-slate-200 pb-2">
                            ${sStyle.icon} ${shift} <span class="bg-slate-200 text-slate-600 rounded-full px-2 py-0.5 ml-auto">${teamMembers.length}</span>
                        </h3>
                        <ul class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            ${teamMembers.map(p => {
                                const pStatus = getStatusToday(p);
                                const badge = getStatusBadge(pStatus, shift);
                                const dimClass = overrideStatuses.includes(pStatus) && pStatus !== 'WFH' ? 'opacity-70 bg-slate-50' : 'bg-white shadow-sm hover:border-slate-300 transition-colors';
                                return `
                                <li class="${dimClass} border border-slate-200 rounded-lg px-3 py-2.5 text-sm flex items-center text-slate-700">
                                    <div class="w-2 h-2 rounded-full ${pStatus === shift ? 'bg-green-400' : 'bg-slate-300'} mr-2.5 shrink-0"></div>
                                    <span class="truncate pr-2">${p}</span>${badge}
                                </li>`;
                            }).join('')}
                        </ul>
                    </div>
                `;
            }
            
            html += `
                        </div>
                    </details>
                </div>
            </div>
            `;

            contentDiv.innerHTML = html;
        }

        function renderMonthlyView() {
            if (Object.keys(currentLoadedData).length === 0) return;

            const contentDiv = document.getElementById('content');
            const sortedDates = Object.keys(currentLoadedData).sort();
            const displayName = formatName(selectedUser);
            
            let html = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                        <h2 class="font-bold text-slate-800 text-lg">${displayName}'s Monthly Schedule</h2>
                    </div>
                    
                    <div class="hidden lg:grid grid-cols-7 gap-px bg-slate-200">
                        ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => `
                            <div class="bg-slate-50 p-3 text-center text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                ${day}
                            </div>
                        `).join('')}
            `;

            if (sortedDates.length > 0) {
                const firstDate = new Date(sortedDates[0] + 'T00:00:00');
                const firstDayOfWeek = firstDate.getDay(); 
                for (let i = 0; i < firstDayOfWeek; i++) {
                    html += `<div class="bg-slate-50 min-h-[100px] p-2"></div>`;
                }
            }

            for (const d of sortedDates) {
                const dayData = currentLoadedData[d];
                let myShift = "Not Found / Leave";
                const validShifts = Object.keys(dayData).filter(k => isNaN(k));

                for (const shift of validShifts) {
                    if (dayData[shift].includes(selectedUser)) {
                        myShift = shift;
                        break;
                    }
                }

                const style = shiftStyles[myShift] || defaultStyle;
                const dateObj = new Date(d + 'T00:00:00');
                const dayNum = dateObj.getDate();
                const isToday = d === currentDate;
                const todayStyles = isToday ? 'ring-2 ring-blue-500 ring-inset bg-blue-50/30' : 'bg-white';

                html += `
                    <div class="${todayStyles} min-h-[100px] p-3 flex flex-col hover:bg-slate-50 transition-colors">
                        <span class="text-sm font-semibold text-slate-700 mb-2 ${isToday ? 'text-blue-600' : ''}">${dayNum}</span>
                        <div class="mt-auto inline-flex items-center gap-1.5 px-2 py-1 rounded-md text-xs font-semibold ${style.bg} ${style.text} border ${style.border} shadow-sm max-w-full overflow-hidden whitespace-nowrap text-ellipsis" title="${myShift}">
                            ${style.icon} <span class="truncate">${myShift}</span>
                        </div>
                    </div>
                `;
            }

            if (sortedDates.length > 0) {
                const lastDate = new Date(sortedDates[sortedDates.length - 1] + 'T00:00:00');
                const lastDayOfWeek = lastDate.getDay();
                for (let i = lastDayOfWeek; i < 6; i++) {
                    html += `<div class="bg-slate-50 min-h-[100px] p-2"></div>`;
                }
            }

            html += `</div>`; 

            // Mobile List View
            html += `
                    <div class="lg:hidden divide-y divide-slate-100">
            `;

            for (const d of sortedDates) {
                const dayData = currentLoadedData[d];
                let myShift = "Not Found / Leave";
                const validShifts = Object.keys(dayData).filter(k => isNaN(k));

                for (const shift of validShifts) {
                    if (dayData[shift].includes(selectedUser)) {
                        myShift = shift;
                        break;
                    }
                }

                const style = shiftStyles[myShift] || defaultStyle;
                const dateObj = new Date(d + 'T00:00:00');
                const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                const monthDay = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                
                const isWeekend = (dateObj.getDay() === 0 || dateObj.getDay() === 6);
                const rowBg = isWeekend ? 'bg-slate-50/50' : 'bg-white';
                const isToday = d === currentDate;
                const todayStyles = isToday ? 'border-l-4 border-l-blue-500 bg-blue-50/20' : 'border-l-4 border-l-transparent';

                html += `
                    <div class="${rowBg} ${todayStyles} p-4 flex justify-between items-center hover:bg-slate-50 transition-colors">
                        <div>
                            <div class="font-semibold text-slate-700">${monthDay}</div>
                            <div class="text-xs text-slate-400 font-medium">${dayName}</div>
                        </div>
                        <div>
                            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold ${style.bg} ${style.text} border ${style.border} shadow-sm">
                                ${style.icon} ${myShift}
                            </span>
                        </div>
                    </div>
                `;
            }

            html += `
                    </div>
                </div>
            `;

            contentDiv.innerHTML = html;
        }

        // Start App
        init();
    </script>
</body>
</html>
